        let currentTopic = 'all';

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            const filtered = currentTopic === 'all' 
                ? longQuestionsData 
                : longQuestionsData.filter(q => q.topic === currentTopic);

            container.innerHTML = filtered.map((item, idx) => `
                <article class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold px-3 py-1 rounded-full ${item.badgeColor}">${item.badge}</span>
                        <span class="text-xs text-stone-400 font-medium">建議作答時間：15 - 20 分鐘</span>
                    </div>
                    <h3 class="font-serif text-xl sm:text-2xl font-bold text-stone-900 mb-4">${item.title}</h3>
                    
                    ${item.sourceText}

                    <div class="space-y-6 mt-4">
                        ${item.subQuestions.map((sub, sIdx) => {
                            const uniqueId = `${item.id}-sub-${sIdx}`;
                            return `
                                <div class="border border-stone-200 rounded-xl p-4 sm:p-5 bg-stone-50/50">
                                    <div class="font-bold text-base sm:text-lg text-stone-900 mb-3 leading-snug">${sub.q}</div>
                                    
                                    <!-- Student Scratchpad / Practice Area -->
                                    <textarea 
                                        rows="4" 
                                        placeholder="✍️ 你可以在此先輸入你的答題大綱或草稿，再點擊下方按鈕核對評分標準與參考範文..."
                                        class="w-full rounded-xl border border-stone-300 bg-white p-3 text-sm text-stone-800 focus:outline-none focus:border-stone-600 transition mb-3"></textarea>

                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <span class="text-xs font-bold text-stone-500">配分標準：${sub.marks}</span>
                                        <button 
                                            onclick="toggleAnswer('${uniqueId}')" 
                                            id="btn-${uniqueId}"
                                            class="px-4 py-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-white font-bold text-xs sm:text-sm transition cursor-pointer">
                                            👁️ 查看評分標準與參考範文
                                        </button>
                                    </div>

                                    <!-- Hidden Marking Scheme & Model Answer -->
                                    <div id="ans-${uniqueId}" class="hidden mt-4 pt-4 border-t border-stone-200 space-y-4">
                                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
                                            <div class="font-bold text-amber-950 text-sm mb-2">📋 評分重點（得分關鍵詞）：</div>
                                            <ul class="space-y-1.5 text-xs sm:text-sm text-amber-900 list-disc pl-5">
                                                ${sub.points.map(pt => `<li>${pt}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div class="bg-emerald-50/80 border border-emerald-200 rounded-xl p-4">
                                            <div class="font-bold text-emerald-950 text-sm mb-2">🌟 滿分參考範文：</div>
                                            <div class="text-xs sm:text-sm text-emerald-950 leading-relaxed whitespace-pre-line">${sub.modelAnswer}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </article>
            `).join('');
        }

        function toggleAnswer(uniqueId) {
            const ansBox = document.getElementById(`ans-${uniqueId}`);
            const btn = document.getElementById(`btn-${uniqueId}`);
            if (ansBox.classList.contains('hidden')) {
                ansBox.classList.remove('hidden');
                btn.textContent = "🙈 隱藏評分標準與範文";
                btn.classList.replace('bg-stone-800', 'bg-stone-500');
            } else {
                ansBox.classList.add('hidden');
                btn.textContent = "👁️ 查看評分標準與參考範文";
                btn.classList.replace('bg-stone-500', 'bg-stone-800');
            }
        }

        function filterTopic(topic) {
            currentTopic = topic;
            document.querySelectorAll('.topic-btn').forEach(btn => {
                if (btn.dataset.topic === topic) {
                    btn.className = "topic-btn px-3 py-1.5 rounded-lg bg-stone-800 text-white font-bold transition cursor-pointer";
                } else {
                    btn.className = "topic-btn px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 font-medium transition cursor-pointer";
                }
            });
            renderQuestions();
        }

        renderQuestions();
    </script>
</body>
</html>
